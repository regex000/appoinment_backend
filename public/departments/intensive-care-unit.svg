<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#FF1493"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b20e66;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#grad)"/>
  
  <!-- Center circle -->
  <circle cx="200" cy="120" r="60" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Text -->
  <text x="200" y="140" font-size="48" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">
    ICU
  </text>
  
  <!-- Department name -->
  <text x="200" y="250" font-size="18" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">
    Intensive Care Unit
  </text>
</svg>